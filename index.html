<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Buscador de Filmes</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background-color: #f4f4f9;
            padding: 20px;
            text-align: center;
        }

        h1 {
            margin-bottom: 20px;
            color: #333;
        }

        .search-box {
            margin-bottom: 30px;
        }

        input {
            padding: 10px 15px;
            font-size: 16px;
            width: 300px;
            border: 1px solid #ccc;
            border-radius: 4px;
            outline: none;
        }

        button {
            padding: 10px 20px;
            font-size: 16px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }

        button:hover {
            background-color: #0056b3;
        }

        .movies-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            justify-content: center;
        }

        .card {
            background-color: white;
            border-radius: 8px;
            width: 200px;
            padding: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            text-align: left;
        }

        .card img {
            width: 100%;
            height: 280px;
            object-fit: cover;
            border-radius: 4px;
        }

        .card h3 {
            font-size: 16px;
            margin: 10px 0 5px 0;
            color: #222;
        }

        .card p {
            font-size: 14px;
            color: #666;
        }
    </style>
</head>
<body>

    <h1>Buscador de Filmes</h1>

    <div class="search-box">
        <input type="text" id="searchInput" placeholder="Digite o nome de um filme...">
        <button onclick="buscarFilmes()">Buscar</button>
    </div>

    <div class="movies-grid" id="moviesContainer"></div>

    <script>
        async function buscarFilmes() {
            const input = document.getElementById('searchInput');
            const container = document.getElementById('moviesContainer');
            const termoBusca = input.value.trim();

            if (!termoBusca) {
                alert('Por favor, digite o nome de um filme.');
                return;
            }

            container.innerHTML = '<p>Buscando filmes...</p>';

            try {
                // Monta a URL enviando o termo digitado como Query Parameter (?search=...)
                const resposta = await fetch(`http://localhost:3000/api/movies?search=${encodeURIComponent(termoBusca)}`);
                const filmes = await resposta.json();

                container.innerHTML = '';

                if (filmes.length === 0) {
                    container.innerHTML = '<p>Nenhum filme encontrado.</p>';
                    return;
                }

                // Percorre a lista de filmes retornados do Back-end
                filmes.forEach(filme => {
                    const card = document.createElement('div');
                    card.className = 'card';

                    // Se o filme tiver imagem de capa, monta a URL do TMDB. Caso contrário, usa uma imagem padrão.
                    const imagemPoster = filme.poster_path 
                        ? `https://image.tmdb.org/t/p/w500${filme.poster_path}`
                        : 'https://via.placeholder.com/200x280?text=Sem+Capa';

                    card.innerHTML = `
                        <img src="${imagemPoster}" alt="${filme.title}">
                        <h3>${filme.title}</h3>
                        <p>Ano: ${filme.release_date ? filme.release_date.split('-')[0] : 'N/A'}</p>
                    `;

                    container.appendChild(card);
                });

            } catch (erro) {
                console.error(erro);
                container.innerHTML = '<p>Erro ao conectar com o servidor.</p>';
            }
        }
    </script>
</body>
</html>
