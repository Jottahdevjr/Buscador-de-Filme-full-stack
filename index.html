<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Buscador de Filmes</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1>Buscador de Filmes</h1>

    <div class="search-box">
        <input type="text" id="searchInput" placeholder="Digite o nome de um filme...">
        <button onclick="buscarFilmes()">Buscar</button>
    </div>

    <div class="movies-grid" id="moviesContainer"></div>

    <script>
        async function buscarFilmes() {
            const input = document.getElementById('searchInput');
            const container = document.getElementById('moviesContainer');
            const termoBusca = input.value.trim();

            if (!termoBusca) {
                alert('Por favor, digite o nome de um filme.');
                return;
            }

            container.innerHTML = '<p>Buscando filmes...</p>';

            try {
                
                const resposta = await fetch(`http://localhost:3000/api/movies?search=${encodeURIComponent(termoBusca)}`);
                const filmes = await resposta.json();

                container.innerHTML = '';

                if (filmes.length === 0) {
                    container.innerHTML = '<p>Nenhum filme encontrado.</p>';
                    return;
                }

                
                filmes.forEach(filme => {
                    const card = document.createElement('div');
                    card.className = 'card';

                    
                    const imagemPoster = filme.poster_path 
                        ? `https://image.tmdb.org/t/p/w500${filme.poster_path}`
                        : 'https://via.placeholder.com/200x280?text=Sem+Capa';

                    card.innerHTML = `
                        <img src="${imagemPoster}" alt="${filme.title}">
                        <h3>${filme.title}</h3>
                        <p>Ano: ${filme.release_date ? filme.release_date.split('-')[0] : 'N/A'}</p>
                    `;

                    container.appendChild(card);
                });

            } catch (erro) {
                console.error(erro);
                container.innerHTML = '<p>Erro ao conectar com o servidor.</p>';
            }
        }
    </script>
</body>
</html>
